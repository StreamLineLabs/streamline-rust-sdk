[package]
# Release workflow configured for automated publishing
name = "streamline-client"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
authors = ["Streamline Team"]
description = "Native Rust client for Streamline streaming platform"
license = "Apache-2.0"
repository = "https://github.com/streamlinelabs/streamline-rust-sdk"
homepage = "https://github.com/streamlinelabs/streamline-rust-sdk"
documentation = "https://docs.rs/streamline-client"
readme = "README.md"
keywords = ["streaming", "kafka", "messaging", "async"]
categories = ["network-programming", "asynchronous"]
exclude = ["testcontainers/"]

[features]
default = ["tokio-runtime", "http-admin", "schema-registry"]
tokio-runtime = ["tokio/full"]
compression-lz4 = []
compression-zstd = []
compression-snappy = []
tls = []
sasl = []
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
http-admin = ["dep:reqwest"]
schema-registry = ["dep:reqwest"]
schema-registry-tls = ["schema-registry", "reqwest/rustls-tls"]
moonshot = ["dep:reqwest", "dep:base64"]
attestation = ["dep:ed25519-dalek", "dep:base64", "dep:sha2"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["net", "io-util", "sync", "time", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Shared optional encoding support
base64 = { version = "0.22", optional = true }

# Attestation verification (optional)
ed25519-dalek = { version = "=2.1.1", optional = true }
sha2 = { version = "0.10", optional = true }

# Telemetry (optional)
opentelemetry = { version = "0.22", optional = true }
opentelemetry_sdk = { version = "0.22", optional = true }
tracing-opentelemetry = { version = "0.23", optional = true }

# HTTP client (for HTTP Admin, Schema Registry, and Moonshot APIs)
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
wiremock = "=0.6.4"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[example]]
name = "producer"
path = "examples/producer.rs"

[[example]]
name = "consumer"
path = "examples/consumer.rs"

[[example]]
name = "agent_memory"
path = "examples/agent_memory.rs"
required-features = ["moonshot"]

[[example]]
name = "security"
path = "examples/security.rs"
required-features = ["tls", "sasl"]

[[example]]
name = "schema_registry"
path = "examples/schema_registry.rs"
required-features = ["schema-registry"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test)"] }
