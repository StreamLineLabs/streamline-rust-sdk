# Docker Compose for integration testing.
#
# The image is intentionally not hard-coded to a mutable tag: set
# STREAMLINE_TEST_IMAGE to an immutable digest reference, matching what CI
# uses, so local and CI runs test the same bits.
#
# Usage:
#   STREAMLINE_TEST_IMAGE=ghcr.io/streamlinelabs/streamline@sha256:<64 hex digits> \
#     docker compose -f docker-compose.test.yml up -d
services:
  streamline:
    image: ${STREAMLINE_TEST_IMAGE:?set STREAMLINE_TEST_IMAGE to an immutable image digest}
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - STREAMLINE_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health"]
      interval: 5s
      timeout: 5s
      retries: 10
